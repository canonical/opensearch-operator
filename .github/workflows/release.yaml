name: Release to latest/edge

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
    branches:
      - 2/edge

jobs:
  ci-tests:
    name: Tests
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: write  # Needed for Allure Report


  release:
    name: Release charm
    needs:
      - ci-tests
    uses: canonical/data-platform-workflows/.github/workflows/release_charm.yaml@v50.0.0
    with:
      channel: 2/edge
      artifact-prefix: ${{ needs.ci-tests.outputs.artifact-prefix }}
    secrets:
      charmhub-token: ${{ secrets.CHARMHUB_TOKEN }}
    permissions:
      contents: write  # Needed to create git tags
