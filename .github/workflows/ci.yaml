name: Tests

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  schedule:
    - cron: '53 0 * * *' # Daily at 00:53 UTC
  # Triggered on push to branch "main" by .github/workflows/release.yaml
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_charm.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: canonical/data-platform-workflows/.github/workflows/lint_workflows.yaml@v50.0.0

  promtool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # prometheus snap includes promtool
      - name: Install prometheus snap
        run: sudo snap install prometheus

      - name: Check validity of prometheus alert rules
        run: |
          promtool check rules machine/src/alert_rules/prometheus/*.yaml
          promtool check rules kubernetes/src/alert_rules/prometheus/*.yaml

  terraform-test:
    name: Terraform - Validation and Simple Deployment product | ${{ matrix.substrate }}
    # TODO remove this when terraform units=0 bug is fixed
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        substrate: [machine, kubernetes]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: (Github hosted) Mount /mnt to have more storage 
        if: matrix.substrate == 'machine'
        run: |
          sudo mkdir -p /mnt/lxd/storage-pools
          sudo mkdir -p /var/snap/lxd/common/lxd/storage-pools
          sudo mount --bind /mnt/lxd/storage-pools /var/snap/lxd/common/lxd/storage-pools

      - name: (GitHub hosted) Free up disk space
        run: |
          printf '\nDisk usage before cleanup\n'
          df --human-readable
          # Based on https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
          rm -r /opt/hostedtoolcache/
          printf '\nDisk usage after cleanup\n'
          df --human-readable

      - name: Install terraform snap
        run: |
          sudo snap install terraform --channel=latest/stable --classic

      - name: Lint / format / validate TF modules
        working-directory: ./terraform/${{ matrix.substrate }}
        run: |
          for dir in charm/opensearch product/simple_deployment product/large_deployment; do
            (cd "${dir}" && terraform init && terraform fmt -check && terraform validate)
          done

      - name: run checks - prepare
        if: matrix.substrate == 'machine'
        run: |
          sudo snap install juju --channel=3.6

      - name: LXD setup
        if: matrix.substrate == 'machine'
        run: |
          sudo snap install lxd --channel=latest/stable
          sudo adduser "$USER" 'lxd'
          # `newgrp` does not work in GitHub Actions; use `sg` instead
          sg 'lxd' -c "lxd waitready"
          sg 'lxd' -c "lxd init --auto"
          sg 'lxd' -c "lxc network set lxdbr0 ipv6.address none"
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          mkdir -p ~/.local/share/juju
          sg 'lxd' -c "juju bootstrap 'localhost' --config model-logs-size=10G"

      - name: K8s setup
        if: matrix.substrate == 'kubernetes'
        run: |
          # Docker and podman networking conflict with Canonical K8s
          sudo apt-get remove --purge -y docker-ce docker-ce-cli containerd.io docker.io containerd 2>/dev/null || true
          sudo nft flush ruleset
          sudo rm -f /etc/cni/net.d/87-podman-bridge.conflist
          sudo snap install concierge --classic
          sudo concierge prepare -c concierge-k8s.yaml --juju-channel=3.6/stable
          # `k8s status --wait-ready` doesn't wait for Cilium, CoreDNS and storage (canonical/k8s-snap#1789)
          for res in deployment/cilium-operator deployment/coredns deployment/metrics-server daemonset/cilium daemonset/ck-storage-rawfile-csi-node statefulset/ck-storage-rawfile-csi-controller; do
            if sudo k8s kubectl -n kube-system get "$res" >/dev/null 2>&1; then
              sudo k8s kubectl -n kube-system rollout status "$res" --timeout=5m
            else
              echo "Skipping rollout status for missing $res"
            fi
          done
          juju controller-config model-logs-size=10G

      - name: Juju setup
        run: |
          juju add-model test --config logging-config='<root>=INFO; unit=DEBUG'

          sudo tee -a /etc/sysctl.conf > /dev/null <<EOT
          vm.max_map_count=262144
          vm.swappiness=0
          net.ipv4.tcp_retries2=5
          fs.file-max=1048576
          EOT

          sudo sysctl -p

      - name: Terraform deploy - simple deployments product module
        working-directory: ./terraform/${{ matrix.substrate }}/product/simple_deployment
        run: |
          MODEL_UUID=$(juju show-model test | grep "model-uuid" | awk '{split($0, a, ": "); print a[2]}')
          terraform apply \
            -var="opensearch={\"model_uuid\": \"$MODEL_UUID\"}" \
            -var="backups={\"config\": {\"bucket\": \"test\"}}" \
            -auto-approve

      - name: Wait for juju deployment
        run: |
          # TODO - remove this when juju wait-for starts reporting the up to date status
          until timeout 2m juju wait-for model test --query='life=="alive" && status=="available"'
          do
            echo "Retrying in 5 seconds..."
            juju status -m test
            sleep 5
          done

  build:
    strategy:
      fail-fast: false
      matrix:
        path:
          - machine
          - kubernetes
          - tests/charms/dummy-client-charm
    name: Build charm | ${{ matrix.path }}
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v50.0.0
    with:
      path-to-charm-directory: ${{ matrix.path }}
      cache: false

  integration-test:
    name: Integration test charm
    needs:
      - lint
      - build
    uses: ./.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    permissions:
      contents: write # Needed for Allure Report
