name: opensearch
display-name: OpenSearch

description: |
  Charm for OpenSearch
docs: https://discourse.charmhub.io/t/charmed-opensearch-documentation/19417
summary: |
  Charm for OpenSearch

charm-user: sudoer

peers:
  opensearch-peers:
    interface: opensearch_peers
  node-lock-fallback:
    interface: node_lock_fallback
  upgrade-version-a:
    # Relation versioning scheme:
    # DA056 - Upgrading in-place upgrade protocol
    # https://docs.google.com/document/d/1H7qy5SAwLiCOKO9xMQJbbQP5_-jGV6Lhi-mJOk4gZ08/edit
    interface: upgrade
  status-peers:
    interface: status-peers

provides:
  peer-cluster-orchestrator:
    interface: peer_cluster
    optional: true
  opensearch-client:
    interface: opensearch_client
  cos-agent: # vm specific
    description: |
      `cos-agent` is a dedicated relation for the grafana agent machine
      charm. It will allow you to set up custom scrape jobs, fetch files
      from arbitrary locations, send alert rules, dashboards, etc.
    interface: cos_agent
    scope: container
  metrics-endpoint: # k8s specific
    interface: prometheus_scrape
  grafana-dashboard: # k8s specific
    interface: grafana_dashboard

requires:
  certificates:
    interface: tls-certificates
    limit: 1
  peer-cluster:
    interface: peer_cluster
    limit: 2 # (main+failover)_cluster_orchestrator(s)
    optional: true
  s3-credentials:
    interface: s3
    limit: 1
  azure-credentials:
    interface: azure
    limit: 1
  gcs-credentials:
    interface: gcs
    limit: 1
  oauth:
    interface: oauth
    limit: 1
    optional: true
  jwt-configuration:
    interface: jwt
    limit: 1
    optional: true
  smtp:
    interface: smtp
  logging: # k8s specific
    interface: loki_push_api

containers:
  opensearch:
    uid: 584792
    gid: 584792
    resource: opensearch-image
    mounts:
      - storage: opensearch-data
        location: /var/lib/opensearch
      - storage: opensearch-logs
        location: /var/log/opensearch

storage:
  opensearch-data:
    type: filesystem
    location: /var/snap/opensearch/common # /mnt/opensearch/data
  opensearch-logs:
    type: filesystem
    location: /var/snap/opensearch/common/var/log/opensearch
    description: Storage for OpenSearch log files

resources:
  opensearch-image:
    type: oci-image
    description: OCI image for opensearch
    upstream-source: ghcr.io/canonical/opensearch:2.19.5-24.04_edge@sha256:9736130a9dc2f7a042de5cbba51f3801ade23a4834bbde61450ca271fd772586
