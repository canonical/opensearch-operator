[tox]
no_package = True
env_list = lint, unit

[vars]
src_path = {tox_root}/machine/src {tox_root}/kubernetes/src
tests_path = {tox_root}/tests
all_path = {[vars]src_path} {[vars]tests_path}

[testenv]
set_env =
    PYTHONPATH = {[vars]src_path}:{tox_root}/lib
    PY_COLORS=1
allowlist_externals =
    poetry

[testenv:format]
description = Apply coding style standards to code
commands_pre =
    poetry install --only format --no-root
commands =
    poetry lock
    poetry run ruff check --fix {[vars]all_path}
    poetry run ruff format {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
allowlist_externals =
    {[testenv]allowlist_externals}
    find
commands_pre =
    poetry install --only lint --no-root
commands =
    poetry check --lock
    poetry run codespell --toml {tox_root}/pyproject.toml {[vars]all_path}
    poetry run ruff check {[vars]all_path}
    poetry run ruff format --check --diff {[vars]all_path}

[testenv:unit]
description = Run unit tests
set_env =
    {[testenv]set_env}
commands_pre =
    poetry install --only main,unit
commands =
    poetry run coverage run --source={[vars]src_path} \
        -m pytest -v --tb native -s {posargs} {[vars]tests_path}/unit
    poetry run coverage report
    poetry run coverage xml

[testenv:integration]
description = Run integration tests
pass_env =
    CI
    CHARM_UBUNTU_BASE
allowlist_externals =
    {[testenv]allowlist_externals}
    # Set the testing host before starting the lxd cloud
    sudo
    sysctl
    apt
    nc

commands_pre =
    poetry install --only main,integration

    # Set the testing host before starting the lxd cloud
    sudo sysctl -w vm.max_map_count=262144 vm.swappiness=0 net.ipv4.tcp_retries2=5
    sudo apt update
    sudo apt install -y netcat-openbsd
commands =
    poetry run pytest -v --tb native --log-cli-level=INFO -s --ignore={[vars]tests_path}/unit/ {posargs}

[testenv:tutorial-extract]
description = Generate tutorial test scripts from Markdown sources
skip_install = True
commands =
    python3 tests/tutorial/extract_commands.py docs/tutorial/ tests/tutorial/tasks/

[testenv:tutorial]
description = Run the tutorial end-to-end test suite via Spread (requires Multipass and Spread)
skip_install = True
change_dir = {tox_root}/tests/tutorial
allowlist_externals =
    spread
commands =
    python3 extract_commands.py ../../docs/tutorial/ ./tasks/
    spread -vv multipass:ubuntu-24.04-64:tasks/

[testenv:guide-upgrade-extract]
description = Generate upgrade-guide test scripts from the Markdown guide
skip_install = True
commands =
    python3 tests/guides/upgrade/extract_guide_tasks.py docs/how-to/upgrade.md tests/guides/upgrade/tasks/

[testenv:guide-upgrade]
description = Run the upgrade-guide end-to-end test suite via Spread (requires Multipass and Spread)
skip_install = True
change_dir = {tox_root}/tests/guides/upgrade
allowlist_externals =
    spread
commands =
    python3 extract_guide_tasks.py ../../docs/how-to/upgrade.md ./tasks/
    spread -vv multipass:ubuntu-24.04-64:tasks/
