[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
# TODO: Remove when library 0.0.7 is released
bcrypt = "^4.3.0"
email-validator = ">=2"

# Testing tools configuration
opensearch-charms-single-kernel = "0.0.9"
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
markers = ["unstable"]
asyncio_mode = "auto"

# Formatting and linting tools configuration
[tool.ruff]
target-version = "py310"
line-length = 99
exclude = [
  "tests/charms/**/lib",
  "tests/integration/**/lib",
]

[tool.ruff.lint]
select = ["E", "W", "F", "C90", "N", "D", "I"]
ignore = ["E501", "D107", "D415", "D417", "N818"]
per-file-ignores = {"tests/*" = ["D100", "D101", "D102", "D103", "D104"]}

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.codespell]
skip = "*.lock,tests/charms/*/lib,tests/integration/*/lib"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = "^0.15.20"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
codespell = "^2.4.2"
ruff = "^0.15.20"
tomli = {version = "^2.0.1", python = "<3.11"}

[tool.poetry.group.unit]
optional = true

[tool.poetry.group.unit.dependencies]
pytest = "^9.1.1"
coverage = { extras = ["toml"], version = "^7.15.2" }
pytest-mock = "^3.15.1"
pytest-operator = "^0.43.2"
responses = "^0.26.1"
ops = { extras = ["testing"], version = "^3.8.0" }
ops-scenario = "^8.8.0"

[tool.poetry.group.integration.dependencies]
pytest = "^9.1.1"
juju = "^3.6.1.3"
coverage = { extras = ["toml"], version = "^7.15.2" }
pytest-asyncio = "^0.21.2"
pytest-operator = "^0.43.2"
allure-pytest = "^2.16.0"
allure-pytest-default-results = "^0.1.4"
pyyaml = "^6.0.2"
protobuf = "^6.31.1"
opensearch-py = "^2.8.0"